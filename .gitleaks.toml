# gitleaks configuration for the pre-commit hook declared in
# .pre-commit-config.yaml (gitleaks picks this file up automatically from the
# repository root). It keeps every default rule and adds the one credential
# class this repository already leaked once and that no default rule, GitHub
# partner pattern or built-in TruffleHog detector knows: Traceloop API keys.
# Same regex as the custom detector in .trufflehog.yaml;
# tests/test_secret_scan_workflow.py asserts both and runs a positive and a
# negative control against this file with the local gitleaks binary.
title = "tracehub-mcp"

[extend]
useDefault = true

[[rules]]
id = "traceloop-api-key"
description = "Traceloop API key (tl_ followed by 32 lowercase alphanumerics)"
regex = '''tl_[a-z0-9]{32}'''
keywords = ["tl_"]

# The default generic-api-key rule reports one line of this repository's own
# test suite: the TEST_TOKEN fixture in tests/test_http_bearer_auth.py, a
# 46-character dummy assembled from words (keyword "credential", separator
# ",", 16-character value). With it, `gitleaks git --pre-commit --staged`
# exits 7 and a maintainer with the hook installed cannot stage that file,
# while TruffleHog in CI does not report it (runtime verification of PR #41,
# T7 fix9/03). The exception is as narrow as the finding: that one rule
# (targetRules), that one literal line (a multiline-anchored regex against the
# whole line), and deliberately no path grant - a path entry would blind the hook
# to a real secret pasted into the file. tests/test_secret_scan_workflow.py
# asserts the shape and replays the staged scan against this file.
[[allowlists]]
description = "the TEST_TOKEN fixture line of tests/test_http_bearer_auth.py"
targetRules = ["generic-api-key"]
regexTarget = "line"
# (?m): gitleaks hands a regexTarget=line regex the line text WITH a leading newline for
# every line but the file's first, so a plain ^ anchor exempted the fixture only when it
# sat on line 1 (runtime verification of the allowlist, T7 fix9 re-run at 7a85535).
regexes = ['''(?m)^TEST_TOKEN = "-"\.join\(\["unit", "test", "operator", "credential", "0123456789abcdef"\]\)$''']
