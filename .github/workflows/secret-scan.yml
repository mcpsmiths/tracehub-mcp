name: Secret Scan

# Redundant PR-time local secret scan alongside GitHub's native secret
# scanning + push protection (already enabled at the repo-settings level).
# Uses TruffleHog OSS rather than gitleaks-action: gitleaks-action requires
# a GITLEAKS_LICENSE secret for org-owned repos (this repo is owned by the
# mcpsmiths org), and no such license/token exists here - TruffleHog OSS is
# free for both personal and org repos with no license key required.
#
# Two jobs:
# - `trufflehog` scans the pushed/PR commit range on every push to main and
#   every PR, as before.
# - `trufflehog-history` scans the WHOLE history of every branch weekly and on
#   demand. The repository once carried a Traceloop API key (start_locally.sh
#   at c5fd220); HEAD is clean but the blob is reachable from every ref and
#   tag, and GitHub has no partner pattern for `tl_` keys, so nothing else
#   would ever surface it. It is expected to flag that historical blob until
#   the owner's rotate/rewrite decision closes it - that is the positive
#   control, not noise.
#
# Both jobs pass `--config .trufflehog.yaml`: TruffleHog ships no detector for
# Traceloop keys (`tl_` + 32 lowercase alphanumerics), so a custom one is
# declared there. A custom detector has no verifier, so its hits are
# UNVERIFIED: the history job includes `unverified` in --results to see them;
# both jobs report `unverified` results too (the only class a verify-less
# custom detector can produce) and exclude the generic URI detector, and the gitleaks
# pre-commit hook (.gitleaks.toml, same regex) covers the local side.
#
# The SHA on `uses` pins only the composite action. Its `version` input
# (default `latest`) picks the ghcr.io/trufflesecurity/trufflehog image that
# does the scanning, so both steps also set `version` to the release named by
# the `# vX.Y.Z` annotation; otherwise the scanner would still be resolved at
# run time despite the pin.

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 5 * * 1"  # Weekly, Monday 05:00 UTC
  workflow_dispatch:  # On-demand whole-history scan

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (changed commits)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9  # v3.99.2
        with:
          version: "3.97.9"
          # `unverified` is required for the custom traceloop-api-key detector to
          # report at all (a detector without a verify block never becomes
          # verified or unknown). The generic URI detector is excluded on purpose:
          # this repository's tests and commit bodies legitimately contain dummy
          # `scheme://user:pass@host.test` fixtures for the userinfo-rejection
          # feature, and their reserved `.test` hosts fail verification, which
          # TruffleHog counts as a finding. Credentials embedded in BACKEND_URL are
          # refused at config load, and the gitleaks pre-commit hook keeps a
          # creds-in-URL rule locally.
          extra_args: --results=verified,unknown,unverified --exclude-detectors=URI --config .trufflehog.yaml

  trufflehog-history:
    name: TruffleHog (whole history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (all branches and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS (every commit on every branch)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9  # v3.99.2
        with:
          # Empty base AND head: on a non push/PR event the action then runs
          # `git file:///tmp/ --since-commit '' --branch ''`, i.e. the whole
          # history of every fetched branch, instead of an event-derived range.
          base: ""
          head: ""
          version: "3.97.9"
          # Same URI exclusion as the PR job (see the comment there).
          extra_args: --results=verified,unknown,unverified --exclude-detectors=URI --config .trufflehog.yaml
