name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) via GitHub OIDC - no stored token
# required. The registry's github-oidc grant for io.github.mcpsmiths/* is
# REPO-scoped, not ref-scoped: any ref of this repository can mint a token
# that may publish under the namespace. The job therefore (1) runs under the
# `release` environment (deployment-branch policy: main; evaluated against
# the caller's ref on the workflow_call path), (2) checks out exactly
# refs/tags/v<version>, verifies HEAD is that tag's commit and that the
# tree's own pyproject.toml version is <version>, and
# (3) asserts server.json's identity (name, single pypi package named
# tracehub-mcp, both version fields) with scripts/check_server_json.py
# before anything is published - so the entry for version X is always tag
# vX's server.json for this project's own distribution.
# Adopts the pattern verified live in github.com/docling-project/docling-mcp's
# own publish-mcp.yml: poll PyPI for the release to actually be live (closes
# the exact race that caused a stale-registry incident before this workflow
# existed) before publishing, and use a pinned, SHA256-verified mcp-publisher
# binary rather than an unpinned build-from-source, which the registry's own
# currently-open issues #1505/#1523 flag as an insecure pattern its own docs
# still recommend.
# The publish step retries every error the registry itself labels transient (its
# PyPI lookup lags pypi.org and fails in several shapes), is idempotent when the
# entry for the version is already live, and a read-back step then requires the
# served listing to be active at the released version (issue #56; the same
# hardening cost-guard-mcp's registry workflow ran through two real releases).
# The registry token `login github-oidc` saves expires 5 minutes after it is
# minted and `publish` never refreshes it, so the publish step logs in again
# before every attempt after the first.
# Recovery: by the time this job runs PyPI and the GitHub Release are already
# live. If it fails, re-run it or dispatch mcp-registry-publish.yml from main
# with version=X.Y.Z; the publish step is idempotent (an already-served entry
# for the version is not an error) and the read-back step re-checks the listing.

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable release ref (tag) whose server.json should be published
        required: true
        type: string
      version:
        description: The version just released (e.g. 0.5.0), used to sync server.json
        required: true
        type: string
  workflow_dispatch:
    # No `ref` input: a manual re-publish is bound to refs/tags/v<version>,
    # matching the workflow_call contract above (release.yml passes the tag
    # it just created). Publishing server.json from a non-tag ref was never a
    # documented procedure.
    inputs:
      version:
        description: The released version (e.g. 0.5.0) whose tag's server.json should be published
        required: true
        type: string

permissions:
  contents: read  # Restrictive default; publish-mcp escalates itself to id-token:write

jobs:
  publish-mcp:
    name: Publish server.json to the MCP Registry
    runs-on: ubuntu-latest
    # The designed worst case (PyPI poll 13.3 min + 8 publish attempts 3.5 min of
    # waits plus the time each failed publish takes + read-back 2.3 min) is about
    # 20 minutes; anything longer is a stalled connection, not progress. The
    # registry token outlives only 5 minutes, so the publish step mints a fresh
    # one per attempt rather than relying on the login step above it.
    timeout-minutes: 30
    # Same boundary as release.yml's publishing jobs: the `release`
    # environment's deployment-branch policy admits only main. On the
    # workflow_call path the policy is evaluated against the caller's ref
    # (release.yml dispatched from main); an off-main workflow_dispatch is
    # refused before the first step.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # workflow_call: the tag release.yml just made; workflow_dispatch:
          # the tag derived from the version input. Never a caller-chosen ref.
          ref: ${{ inputs.ref || format('refs/tags/v{0}', inputs.version) }}
          fetch-depth: 0  # tags are needed for the guard below
          persist-credentials: false

      - name: Validate version input format
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version input '${NEW_VERSION}' is not a valid semver (expected X.Y.Z or X.Y.Z-prerelease)"
            exit 1
          fi

      - name: Verify checkout is the release tag
        # Fails closed if HEAD is not the commit behind refs/tags/v<version>,
        # and if the tree's own version string disagrees with the tag it was
        # named by - the same guard docker-publish.yml applies. The second
        # check has to live HERE, before the jq sync below: the sync rewrites
        # both server.json version fields to the input, so check_server_json's
        # version clause can only ever agree with it, and a tag v0.12.8
        # pointing at the 0.12.3 tree would otherwise reach the publish step
        # with only the PyPI poll left to notice.
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/v${NEW_VERSION}^{commit}")" ]; then
            echo "::error::HEAD is not tag v${NEW_VERSION}"
            exit 1
          fi
          python3 - "$NEW_VERSION" <<'PY'
          import sys, tomllib
          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          if declared != sys.argv[1]:
              print(f"::error::pyproject.toml declares {declared}, release tag is v{sys.argv[1]}")
              sys.exit(1)
          PY

      - name: Sync server.json version (in-workspace only, not committed)
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$NEW_VERSION" \
            '.version = $v | .packages[0].version = $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json | jq '{name, version, package_version: .packages[0].version}'

      - name: Assert server.json identity
        # Fails closed unless .name, exactly one pypi package whose identifier
        # is tracehub-mcp, and both version fields are what this project
        # publishes - the semver check above and the jq sync never looked at
        # the identity fields.
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: python3 scripts/check_server_json.py --expect-version "$NEW_VERSION" server.json

      - name: Wait for PyPI to serve the release with the ownership marker
        run: |
          name="$(jq -r '.name' server.json)"
          # Derived from the identifier the step above just asserted, so the
          # poll and the published entry can never name different distributions.
          identifier="$(jq -r '.packages[0].identifier' server.json)"
          echo "Waiting for PyPI ${identifier} ${NEW_VERSION} with marker 'mcp-name: ${name}'"
          for i in $(seq 1 40); do
            desc="$(curl -sf --max-time 30 "https://pypi.org/pypi/${identifier}/${NEW_VERSION}/json" \
              | jq -r '.info.description' 2>/dev/null || true)"
            if printf '%s' "$desc" | grep -qF "mcp-name: ${name}"; then
              echo "Ownership marker present on PyPI ${NEW_VERSION}"
              exit 0
            fi
            echo "Attempt ${i}/40: not yet - sleeping 20s"
            sleep 20
          done
          echo "::error::PyPI ${NEW_VERSION} with the ownership marker was not found in time"
          exit 1
        env:
          NEW_VERSION: ${{ inputs.version }}

      - name: Install mcp-publisher (pinned, SHA256-verified)
        run: |
          version="1.8.1"
          archive="mcp-publisher_linux_amd64.tar.gz"
          expected_sha256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          url="https://github.com/modelcontextprotocol/registry/releases/download/v${version}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 "$url" --output "$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher
          chmod 0755 mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Validate and publish server.json
        # The registry does its own server-side PyPI lookup at publish time, on
        # a different network path than the wait-loop above, and it lags it: in
        # production that wait loop's own curl already saw the release while the
        # registry's check still 404ed for ~30s longer ("PyPI package exists,
        # but version was not found - a newly published release can take a
        # moment to appear on PyPI. Wait and retry"). The budget is 8 attempts
        # 30 s apart, no wait after the last. Retry only the errors the
        # registry's PyPI validator labels transient (registry source
        # internal/validators/registries/pypi.go at v1.8.1): "version ... was not
        # found (status: 404)" (release not yet visible), "Likely transient,
        # retry later" (PyPI 429, 5xx, or an inconclusive package probe) and
        # "failed to fetch package metadata from PyPI" (PyPI unreachable).
        # Anything else fails at once - in particular a duplicate version
        # ("invalid version: cannot publish duplicate version"; registry
        # versions are immutable) and a validation failure - except that when
        # the entry for this exact version is already served (a lost success
        # response, or a re-dispatch for an already-published tag) the step
        # reports it and lets the read-back step decide whether the served entry
        # is right.
        # The registry token minted by the login step is valid for 5 minutes
        # (registry v1.8.1 internal/auth/jwt.go) and `publish` reads the saved
        # token without refreshing it. Seven 30 s waits plus the failed publishes
        # outlast that, so every attempt after the first logs in again just before
        # it publishes; a 401 from a stale token would otherwise be classed as
        # non-transient and end the step with a misleading error.
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          ./mcp-publisher validate server.json

          name="$(jq -r '.name' server.json)"
          encoded="$(jq -rn --arg s "$name" '$s | @uri')"
          entry_url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded}/versions/${NEW_VERSION}"
          for attempt in $(seq 1 8); do
            if [ "$attempt" -gt 1 ]; then
              if ! ./mcp-publisher login github-oidc; then
                echo "::warning::registry re-login failed before attempt ${attempt}; publishing with the saved token"
              fi
            fi
            if output="$(./mcp-publisher publish 2>&1)"; then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if ! printf '%s' "$output" | grep -qE 'was not found \(status: 404\)|Likely transient, retry later|failed to fetch package metadata from PyPI'; then
              if curl -sf --max-time 30 "$entry_url" >/dev/null; then
                echo "${name} ${NEW_VERSION} is already published on the registry - the read-back step checks the served entry"
                exit 0
              fi
              exit 1
            fi
            if [ "$attempt" -lt 8 ]; then
              echo "Attempt ${attempt}/8: registry has not yet confirmed this PyPI release, waiting 30s..."
              sleep 30
            fi
          done
          echo "::error::mcp-publisher publish still failing after 8 attempts. PyPI and the GitHub Release are already live; re-run this job or dispatch mcp-registry-publish.yml from main with version=${NEW_VERSION} (the publish step is idempotent)."
          exit 1

      - name: Confirm the published entry
        # Reads back what the registry now serves for this version and requires
        # it to name this PyPI project at the released version (the fields a
        # registry consumer installs from) with status active - a deprecated or
        # deleted entry at this version is a failure. The response shape is
        # {server: {...}, _meta: {"io.modelcontextprotocol.registry/official":
        # {status, ...}}} (registry docs/reference/api/openapi.yaml, v1.8.1).
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          name="$(jq -r '.name' server.json)"
          identifier="$(jq -r '.packages[0].identifier' server.json)"
          encoded="$(jq -rn --arg s "$name" '$s | @uri')"
          body=""
          for i in $(seq 1 10); do
            if body="$(curl -sf --max-time 30 "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded}/versions/${NEW_VERSION}")"; then
              break
            fi
            if [ "$i" -lt 10 ]; then
              echo "Attempt ${i}/10: entry not readable yet - sleeping 15s"
              sleep 15
            fi
          done
          if [ -z "$body" ]; then
            echo "::error::Registry entry for ${name} ${NEW_VERSION} was not readable after 10 attempts. PyPI and the GitHub Release are already live; re-run this job or dispatch mcp-registry-publish.yml from main with version=${NEW_VERSION} (the publish step is idempotent)."
            exit 1
          fi
          printf '%s' "$body" | jq '{name: (.server // .).name, version: (.server // .).version, package: (.server // .).packages[0], meta: ._meta}'
          if ! printf '%s' "$body" | jq -e --arg v "$NEW_VERSION" --arg id "$identifier" \
            '(.server // .) as $s | $s.version == $v and $s.packages[0].registryType == "pypi" and $s.packages[0].identifier == $id and $s.packages[0].version == $v and ._meta["io.modelcontextprotocol.registry/official"].status == "active"' >/dev/null; then
            echo "::error::The registry serves ${name} ${NEW_VERSION}, but not as an active pypi/${identifier}/${NEW_VERSION} entry (see the printed record). PyPI and the GitHub Release are already live; re-dispatching mcp-registry-publish.yml cannot change a served record, so inspect the entry and fix the workflow on main if the check itself is wrong."
            exit 1
          fi
          echo "Registry serves ${name} ${NEW_VERSION} (status active) with package record pypi/${identifier}/${NEW_VERSION}"
