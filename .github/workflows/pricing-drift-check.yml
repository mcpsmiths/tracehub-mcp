name: Pricing Drift Check

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC

permissions:
  contents: read  # Restrictive default; check-drift escalates itself to write

jobs:
  check-drift:
    name: Check for litellm pricing drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"  # same uv as Dockerfile; tests/test_build_toolchain.py
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Refresh vendored pricing table
        # Runs the existing, unmodified refresh script - see
        # src/opentelemetry_mcp/pricing/README.md for why this project
        # deliberately does not auto-fetch pricing at runtime (litellm's
        # own automated pricing-updater has failed silently before).
        # This job only automates *noticing* drift; a human still reviews
        # and merges the resulting PR.
        run: uv run python scripts/sync_model_prices.py

      - name: Sanity-check the fetched payload before proceeding
        run: |
          uv run python -c "
          import json
          data = json.loads(open('src/opentelemetry_mcp/pricing/model_prices.json').read())
          assert isinstance(data, dict), 'expected a JSON object'
          assert len(data) > 10, f'suspiciously few entries: {len(data)}'
          print(f'Sanity check passed: {len(data)} entries')
          "

      - name: Check for drift
        id: diff
        run: |
          if git diff --quiet -- src/opentelemetry_mcp/pricing/model_prices.json src/opentelemetry_mcp/pricing/metadata.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR on drift
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "chore(pricing): sync vendored litellm pricing table"
          title: "chore(pricing): vendored pricing table drift detected"
          body: |
            Automated weekly sync detected drift between the vendored
            `model_prices.json`/`metadata.json` and litellm's upstream
            `model_prices_and_context_window.json`. Review the diff before
            merging - see `src/opentelemetry_mcp/pricing/README.md`.
          branch: chore/pricing-sync-drift
          delete-branch: true
          labels: automated,pricing
