name: Release

on:
  workflow_dispatch:  # Manual trigger via GitHub Actions UI
    inputs:
      increment:
        description: >-
          Override the auto-detected bump (MAJOR/MINOR/PATCH). Leave empty to
          let Commitizen infer it from conventional-commit prefixes as usual.
        required: false
        type: choice
        default: ""
        options: ["", "MAJOR", "MINOR", "PATCH"]

permissions:
  contents: write      # Required for pushing commits, tags, and creating releases
  id-token: write      # Required for PyPI OIDC (Trusted Publishing)

jobs:
  bump-version:
    name: Bump Version & Create Release
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.cz.outputs.version }}
      already_released: ${{ steps.check_release.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Full history required for Commitizen
          # The default GITHUB_TOKEN authenticates as the github-actions[bot]
          # app identity, which the main-protection ruleset's bypass_actors
          # (OrganizationAdmin only) does not cover - its push below would be
          # rejected with "Changes must be made through a pull request."
          # RELEASE_PAT belongs to a real org-admin account the ruleset
          # already trusts, scoped to just this repo with Contents: read/write.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"

      - name: Install Commitizen
        run: pip install commitizen

      - name: Bump version
        id: cz
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff  # master (no tagged releases; pinned snapshot, re-pin periodically)
        with:
          # Same reason as the checkout step above: this action does the
          # actual `git push` of the bump commit, which needs a token the
          # main-protection ruleset's bypass covers.
          github_token: ${{ secrets.RELEASE_PAT }}
          increment: ${{ github.event.inputs.increment }}
          changelog_increment_filename: body.md
          # The action's own entrypoint runs `git config --local user.name/email`
          # unconditionally using these inputs (default: github-actions[bot]) --
          # a standalone `git config` step earlier in this job has no effect,
          # since this overwrites it right before the bump commit is made.
          git_name: "sairam0424"
          git_email: "uggesairam0000@gmail.com"

      - name: Print version info
        run: |
          echo "New version: ${{ steps.cz.outputs.version }}"
          echo "Version bump: ${{ steps.cz.outputs.version }}"

      - name: Check if this version was already released
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # commitizen-action's no_raise: 21 means a run with no bump-worthy
          # commits (e.g. docs-only) exits 0 rather than failing, but leaves
          # steps.cz.outputs.version pointing at the CURRENT (unchanged)
          # version, not a new one. Without this check, the next two steps
          # tried to recreate and republish an already-existing release and
          # crashed with a 422 instead of just doing nothing.
          if gh release view "v${{ steps.cz.outputs.version }}" >/dev/null 2>&1; then
            echo "No new version to release (already released as v${{ steps.cz.outputs.version }})."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # steps.cz.outputs.version is the BARE version (e.g. "0.2.0"), but
          # `cz bump` itself creates its git tag using this repo's tag_format
          # ("v$version" per .cz.toml) -- using the bare version here instead
          # creates a second, different tag with no commit history relation
          # to the one cz already made, attaching the Release to the wrong
          # one. Apply the same "v" prefix so the Release lands on the tag
          # that actually exists.
          gh release create "v${{ steps.cz.outputs.version }}" \
            --title "Release v${{ steps.cz.outputs.version }}" \
            --notes-file "body.md"

  build-and-publish:
    name: Build and Publish to PyPI
    needs: bump-version
    if: needs.bump-version.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI OIDC
    steps:
      - name: Checkout code (with new version)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main  # Get the version-bumped code

      - name: Setup UV
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          uv build --wheel --sdist
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        # No credentials needed - uses OIDC/Trusted Publishing!

  test-installation:
    name: Test PyPI Installation
    needs: [bump-version, build-and-publish]
    if: needs.bump-version.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"

      - name: Wait for package availability and test installation
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.new_version }}
        run: |
          # A fixed sleep before a single install attempt previously failed a
          # real, successful release (PyPI CDN propagation lag exceeded 60s)
          # even though the publish itself had already succeeded - poll
          # instead of guessing a bigger fixed number.
          for attempt in $(seq 1 10); do
            if pip install "tracehub-mcp==${NEW_VERSION}" 2>/dev/null; then
              echo "Installed on attempt ${attempt}"
              break
            fi
            echo "Attempt ${attempt}/10: tracehub-mcp==${NEW_VERSION} not yet available on PyPI, waiting 30s..."
            sleep 30
          done
          python -c "import opentelemetry_mcp; print(f'Installed version: {opentelemetry_mcp.__version__}')"
          tracehub-mcp --help

      - name: Installation successful
        run: echo "✅ Package successfully published and verified on PyPI!"

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [bump-version, test-installation]
    if: needs.bump-version.outputs.already_released == 'false'
    uses: ./.github/workflows/mcp-registry-publish.yml
    with:
      ref: v${{ needs.bump-version.outputs.new_version }}
      version: ${{ needs.bump-version.outputs.new_version }}
    permissions:
      id-token: write
      contents: read
