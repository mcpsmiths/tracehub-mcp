name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        types: [opened, synchronize]

permissions:
  contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            - name: Setup UV
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
              with:
                  version: "latest"
                  enable-cache: true
            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
              with:
                  python-version: "3.13"
            - name: Install dependencies
              run: uv sync --dev
            - name: Lint with Ruff
              run: uv run ruff check --output-format=github
            - name: Format check with Ruff
              run: uv run ruff format --check .
            - name: Lint with Mypy
              run: uv run mypy .
            - name: Audit dependencies for known vulnerabilities
              run: uv run pip-audit
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            - name: Setup UV
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
              with:
                  version: "latest"
                  enable-cache: true
            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
              with:
                  python-version: "3.13"
            - name: Install dependencies
              run: uv sync --dev
            - name: Test with pytest
              run: uv run pytest --cov-report=xml
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                files: ./coverage.xml
                fail_ci_if_error: true
    conformance:
        name: MCP Conformance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            - name: Setup UV
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
              with:
                  version: "latest"
                  enable-cache: true
            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
              with:
                  python-version: "3.13"
            - name: Setup Node
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5
              with:
                  # @modelcontextprotocol/conformance's dependency tree (a
                  # transitive content-type@3.1.0) now requires Node >=22 -
                  # Node 20 fails with "SyntaxError: The requested module
                  # 'fs' does not provide an export named 'globSync'"
                  # before the suite even starts, confirmed live in CI.
                  node-version: "22"
            - name: Install dependencies
              run: uv sync --dev
            - name: Start server (streamable-http)
              env:
                  BACKEND_TYPE: jaeger
                  BACKEND_URL: http://localhost:16686
              run: |
                  # --rate-limit-max-requests 0: the conformance suite runs
                  # the full ~30-scenario active suite back-to-back against
                  # this one server from a single client IP, which exceeds
                  # the production default (100 req/60s) partway through and
                  # produces false-positive 429s on later, entirely
                  # legitimate scenarios (confirmed live: prompts-list and
                  # dns-rebinding-protection both failed with "Rate limit
                  # exceeded"/HTTP 429, not a real protocol or Origin-
                  # validation gap - OriginValidationMiddleware's own DNS-
                  # rebinding rejection passes correctly on its own).
                  # Conformance testing protocol behavior, not
                  # abuse-resistance, so disabling it for this ephemeral,
                  # single-purpose CI server is correct - production
                  # defaults are unchanged.
                  uv run tracehub-mcp --transport http --host 127.0.0.1 --port 8765 --rate-limit-max-requests 0 &
                  echo $! > /tmp/tracehub-mcp.pid
                  for _ in $(seq 1 10); do
                    curl -s -o /dev/null http://127.0.0.1:8765/mcp && break
                    sleep 1
                  done
            - name: Run MCP conformance suite
              run: |
                  npx --yes @modelcontextprotocol/conformance server \
                    --url http://127.0.0.1:8765/mcp \
                    --suite active \
                    --expected-failures ./conformance-baseline.yml
            - name: Stop server
              if: always()
              run: kill "$(cat /tmp/tracehub-mcp.pid)" 2>/dev/null || true
    build-test:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            pull-requests: write
            security-events: write
        strategy:
            matrix:
                platform: [amd64, arm64]
                include:
                    - platform: amd64
                      runs-on: ubuntu-latest
                      docker-platform: linux/amd64
                    - platform: arm64
                      runs-on: ubuntu-24.04-arm
                      docker-platform: linux/arm64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

            - name: Docker Build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
              with:
                  platforms: ${{ matrix.docker-platform }}
                  context: .
                  load: true
                  push: false
                  tags: tracehub-mcp-server:${{ github.sha }}-${{ matrix.platform }}

            - name: Smoke-test the built image actually runs
              # `docker build` succeeding only proves the image's filesystem
              # layers assembled - it never invokes the venv's own
              # interpreter, so a builder/runtime base-image Python version
              # desync (silently introduced by a Docker minor/patch-only
              # Dependabot bump touching only one of the two stages) shipped
              # 4 real releases whose entrypoint crashed on every single run
              # with "ModuleNotFoundError: No module named
              # 'opentelemetry_mcp'" while this job stayed green throughout.
              # Actually start the container and confirm the process stays
              # up and the HTTP transport actually binds and answers - NOT
              # by waiting for the Dockerfile's own HEALTHCHECK to report
              # "healthy", since that now probes /ready (a real
              # health_check()+list_services() call against BACKEND_URL,
              # deliberately - see docker_healthcheck.py), and this job has
              # no reachable trace backend to point it at. This step only
              # needs to catch "the entrypoint crashed on startup", the
              # same class of bug the Python-version desync caused - not
              # re-verify live backend connectivity, which is what the
              # /ready probe itself is for in a real deployment.
              run: |
                  docker run -d --name smoke-test \
                    -p 18000:8000 \
                    -e BACKEND_TYPE=jaeger \
                    -e BACKEND_URL=http://localhost:16686 \
                    "tracehub-mcp-server:${{ github.sha }}-${{ matrix.platform }}"

                  for i in $(seq 1 15); do
                    if [ "$(docker inspect --format='{{.State.Status}}' smoke-test 2>/dev/null)" = "exited" ]; then
                      echo "::error::Container exited unexpectedly - entrypoint crashed"
                      docker logs smoke-test
                      docker rm -f smoke-test
                      exit 1
                    fi
                    # Any real HTTP response (curl's own %{http_code}, even
                    # a 4xx) proves uvicorn bound the port and the ASGI app
                    # is serving. Branch on curl's own exit status, not on
                    # comparing the captured %{http_code} string against a
                    # sentinel: curl still writes "000" via -w on a refused
                    # connection *and* exits non-zero, so a naive `||
                    # echo 000` fallback on top of that concatenates into
                    # "000000" - which is != "000" and was wrongly treated
                    # as a real status code (confirmed live in CI).
                    if status_code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18000/mcp 2>/dev/null)"; then
                      echo "HTTP transport is up and answering (got status ${status_code} from /mcp) after ${i} attempt(s)"
                      docker logs smoke-test
                      docker rm -f smoke-test
                      exit 0
                    fi
                    echo "Attempt ${i}/15: HTTP transport not answering yet, waiting 2s..."
                    sleep 2
                  done

                  echo "::error::Container never started answering HTTP requests within 30s"
                  docker logs smoke-test
                  docker rm -f smoke-test
                  exit 1

            - name: Cache Trivy
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: ~/.cache/trivy
                  key: trivy-${{ runner.os }}-${{ matrix.platform }}
                  restore-keys: |
                      trivy-${{ runner.os }}-
            - name: Trivy scan (JSON)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
              with:
                  image-ref: tracehub-mcp-server:${{ github.sha }}-${{ matrix.platform }}
                  scanners: secret,vuln
                  exit-code: "0"
                  severity: CRITICAL,HIGH
                  format: json
                  output: trivy-results-${{ matrix.platform }}.json
                  # Confirmed live: python:3.13-slim-trixie currently carries
                  # ~44 HIGH findings in OS packages (util-linux/bsdutils
                  # etc.) that Trivy reports as "affected" with no Fixed
                  # Version at all - Debian trixie's own upstream has not
                  # shipped a patch yet, so `apt-get upgrade` (already in
                  # this Dockerfile) genuinely cannot resolve them no matter
                  # how often this image is rebuilt. Gating on those would
                  # permanently block every build for a condition nothing in
                  # this repo can fix. ignore-unfixed scopes both this scan's
                  # own findings and the "Fail on CRITICAL/HIGH findings"
                  # step below to only genuinely actionable findings (a real
                  # Fixed Version exists) - confirmed locally this still
                  # catches genuine, fixable HIGH CVEs (setuptools/msgpack).
                  ignore-unfixed: true
            - name: Convert to table
              run: trivy convert --format table --output trivy-results-${{ matrix.platform }}.txt trivy-results-${{ matrix.platform }}.json
            - name: Convert to SARIF
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              run: trivy convert --format sarif --output trivy-results-${{ matrix.platform }}.sarif trivy-results-${{ matrix.platform }}.json
            - name: Upload SARIF to GitHub Security
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
              with:
                  sarif_file: trivy-results-${{ matrix.platform }}.sarif
                  category: container-security-tracehub-mcp-server-${{ matrix.platform }}
            - name: Log Trivy results
              run: |
                  echo "::group::Trivy Scan Results (tracehub-mcp-server-${{ matrix.platform }})"
                  if [ -s "trivy-results-${{ matrix.platform }}.txt" ]; then
                    cat "trivy-results-${{ matrix.platform }}.txt"
                  else
                    echo "No issues found!"
                  fi
                  echo "::endgroup::"
            - name: Prepare PR comment
              if: github.event_name == 'pull_request'
              run: |
                  MAX_CHARS=60000
                  RESULTS_FILE="trivy-results-${{ matrix.platform }}.txt"
                  COMMENT_FILE="trivy-comment-${{ matrix.platform }}.md"
                  FILE_SIZE=$(wc -c < "$RESULTS_FILE" || echo "0")
                  {
                    echo "## Container Security Scan (tracehub-mcp-server-${{ matrix.platform }})"
                    echo ""
                    if [ ! -s "$RESULTS_FILE" ]; then
                      echo "**No vulnerabilities found!**"
                    else
                      echo "<details>"
                      echo "<summary>Click to expand results</summary>"
                      echo ""
                      echo '```'
                      if [ "$FILE_SIZE" -gt "$MAX_CHARS" ]; then
                        head -c "$MAX_CHARS" "$RESULTS_FILE"
                        echo ""
                        echo "... (output truncated - exceeded ${MAX_CHARS} characters)"
                        echo "See full results in workflow logs"
                      else
                        cat "$RESULTS_FILE"
                      fi
                      echo '```'
                      echo ""
                      echo "</details>"
                    fi
                  } > "$COMMENT_FILE"
            - name: Post PR comment
              if: github.event_name == 'pull_request'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v2
              with:
                  header: trivy-scan-tracehub-mcp-server-${{ matrix.platform }}
                  path: trivy-comment-${{ matrix.platform }}.md
            - name: Fail on CRITICAL/HIGH findings
              # The scan step above deliberately runs with exit-code "0" so
              # the informational/comment steps above still execute and post
              # even when there are findings. This step is the actual gate:
              # it re-reads the same JSON results file and fails the build
              # if any CRITICAL/HIGH vulnerability, secret, or
              # misconfiguration is present. `if: always()` so this gate
              # still runs (and fails closed) even if an earlier
              # informational step in this job errors out.
              if: always()
              run: |
                  RESULTS_FILE="trivy-results-${{ matrix.platform }}.json"
                  if [ ! -f "$RESULTS_FILE" ]; then
                    echo "::error::${RESULTS_FILE} not found - Trivy scan did not complete, failing closed"
                    exit 1
                  fi
                  FINDING_COUNT=$(jq '[(.Results // [])[] | ((.Vulnerabilities // []) + (.Secrets // []) + (.Misconfigurations // []))[]] | length' "$RESULTS_FILE")
                  if [ "$FINDING_COUNT" -gt 0 ]; then
                    echo "::error::${FINDING_COUNT} CRITICAL/HIGH finding(s) in ${RESULTS_FILE} - see the Trivy Scan Results log or PR comment above for details"
                    exit 1
                  fi
                  echo "No CRITICAL/HIGH findings in ${RESULTS_FILE}"
