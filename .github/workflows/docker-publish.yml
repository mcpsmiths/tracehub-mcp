name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual re-publish of an EXISTING release tag (e.g. after a base-image
    # refresh), never of an arbitrary branch: the job below refuses any ref
    # that is not refs/tags/vX.Y.Z before it logs in to GHCR. Moving the
    # mutable :latest tag is an explicit per-dispatch choice, off by default.
    inputs:
      tag:
        description: Existing release tag to re-publish, e.g. v0.12.3
        required: true
        type: string
      also_tag_latest:
        description: Also move ghcr.io/mcpsmiths/tracehub-mcp:latest to this build
        required: false
        type: boolean
        default: false

permissions:
  contents: read  # Restrictive default; build-and-push escalates to packages:write itself

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve release tag
        id: version
        # Runs BEFORE checkout and login so a non-release ref fails the job
        # with nothing fetched and no registry session. Reads every value
        # through env vars - inlining ${{ }} expressions into the script text
        # is the GitHub Actions injection pattern (substitution happens before
        # bash parses the script). GITHUB_EVENT_NAME and GITHUB_REF are real
        # runner env vars already.
        env:
          TAG_INPUT: ${{ inputs.tag }}
          ALSO_LATEST: ${{ inputs.also_tag_latest }}
        run: |
          image="ghcr.io/mcpsmiths/tracehub-mcp"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="$GITHUB_REF"
            latest=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="refs/tags/${TAG_INPUT}"
            latest=false
            [[ "$ALSO_LATEST" == "true" ]] && latest=true
          else
            echo "::error::refusing to publish from a non-release ref (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} tag=${TAG_INPUT})"
            exit 1
          fi
          tag="${ref#refs/tags/v}"
          {
            echo "ref=${ref}"
            echo "tag=${tag}"
            echo "latest=${latest}"
            # The complete image tag list, so the build step never sees an
            # empty line and :latest appears only when explicitly resolved.
            echo "tags<<TAGS_EOF"
            echo "${image}:${tag}"
            if [[ "$latest" == "true" ]]; then
              echo "${image}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.version.outputs.ref }}
          fetch-depth: 0  # tags are needed for the guard below
          persist-credentials: false

      - name: Verify checkout is the release tag
        # Fails closed if the ref did not resolve to the tag's commit, and if
        # the tree's own version string disagrees with the tag it was named
        # by (a re-pointed tag or a mislabelled tree never becomes :X.Y.Z).
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/v${TAG}^{commit}")"
          python3 - "$TAG" <<'PY'
          import sys, tomllib
          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          if declared != sys.argv[1]:
              print(f"::error::pyproject.toml declares {declared}, tag is v{sys.argv[1]}")
              sys.exit(1)
          PY

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          # mode=max records the full build definition in the attestation so
          # SECURITY.md's provenance claim names the exact source commit.
          provenance: mode=max
          tags: ${{ steps.version.outputs.tags }}

      # GHCR packages default to private on first publish. Changing that needs
      # a token with the packages scope - the default GITHUB_TOKEN does not
      # have it (confirmed: PATCH .../visibility returns a real 404, not a
      # permissions error, with this exact token). This is a one-time setting
      # per package, not per version, so it does not need automating here -
      # flip it once at:
      # https://github.com/mcpsmiths/tracehub-mcp/pkgs/container/tracehub-mcp/settings
