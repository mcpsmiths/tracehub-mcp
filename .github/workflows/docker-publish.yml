name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Manual trigger via GitHub Actions UI, for re-publishing without a new tag

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: version
        env:
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          # GITHUB_REF is already provided as a real env var by the runner -
          # inlining ${{ github.ref }} (or any other expression) directly
          # into this script's text is a known GitHub Actions injection
          # pattern, since the substitution happens before bash parses the
          # script. Read every expression through an env var instead, so
          # the value is always treated as data, never as script text.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GH_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          tags: |
            ghcr.io/mcpsmiths/tracehub-mcp:${{ steps.version.outputs.tag }}
            ghcr.io/mcpsmiths/tracehub-mcp:latest

      # GHCR packages default to private on first publish. Changing that needs
      # a token with the packages scope - the default GITHUB_TOKEN does not
      # have it (confirmed: PATCH .../visibility returns a real 404, not a
      # permissions error, with this exact token). This is a one-time setting
      # per package, not per version, so it does not need automating here -
      # flip it once at:
      # https://github.com/mcpsmiths/tracehub-mcp/pkgs/container/tracehub-mcp/settings
