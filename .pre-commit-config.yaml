# Pre-commit hooks mirroring the checks CI runs (uv run ruff check / mypy .).
# Run `pre-commit install` once to enable, or `pre-commit run --all-files` ad hoc.
# Hook versions are pinned to the exact ruff/mypy versions this project resolves
# in pyproject.toml/uv.lock, so local pre-commit results match CI.
#
# mypy is skipped on pre-commit.ci specifically (not locally, not in real CI):
# it's a `language: system` hook that shells out to `uv run mypy .`, and
# pre-commit.ci's hosted sandbox has no `uv` on PATH - it provisions
# `language: python`/`language: node` hooks itself but does zero setup for
# `language: system` ones. That makes the hook fail with "Executable `uv`
# not found" on every PR to this repo regardless of what changed (confirmed
# on #20 and #21, neither of which touch Python). Real type-checking still
# happens via the project's own `uv run mypy .` step in GitHub Actions CI.
#
# gitleaks is skipped on pre-commit.ci too: it is a `language: golang` hook
# that pre-commit.ci's sandbox cannot build. Secret detection in CI is the
# TruffleHog workflow (.github/workflows/secret-scan.yml); this hook is the
# local, pre-commit-time counterpart with the same custom rule (.gitleaks.toml).
ci:
  skip: [mypy, gitleaks]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args:
          - "--skip=uv.lock,tests/integration/cassettes/**"
          - "--ignore-words-list=unparseable,fo"

  # Secret detection before a commit exists. The pre-commit hook needs no
  # license (unlike gitleaks-action for org-owned repos) and reads
  # .gitleaks.toml from the repo root: every default rule plus the Traceloop
  # `tl_` key rule, the credential class this repo already leaked once.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  # mypy needs pydantic (for its BaseModel plugin) and the rest of this
  # project's real dependency graph to type-check correctly - the mirrors-mypy
  # hook's isolated env only sees `additional_dependencies`, which drifts from
  # pyproject.toml. Running it through the project's own uv-managed venv keeps
  # this hook's result identical to CI's `uv run mypy .` by construction.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
