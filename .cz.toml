[tool.commitizen]
name = "cz_conventional_commits"
version = "0.12.3"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
version_scheme = "pep440"

# Files where Commitizen will update the version
version_files = [
    "pyproject.toml:version",
    "src/opentelemetry_mcp/__init__.py:__version__",
    "mcpb/manifest.json:version",
    "mcpb/pyproject.toml:version",
    # both "version" fields (top-level + packages[0]) - published to the MCP Registry on
    # every release; drifted to 0.4.0 once because it was missing from this list
    "server.json:version"
]

# uv.lock also carries this project's own version but cannot be a version_files
# entry (every package in it has a `version = "..."` line). This hook rewrites
# just that block after the files above are bumped and before the `git commit -a`,
# so the bump commit and the tag carry a consistent lockfile. Runs inside
# commitizen-action's python:3.10-alpine container - stdlib only, no uv there.
pre_bump_hooks = ["python3 scripts/sync_uv_lock_version.py"]

# Changelog configuration
[tool.commitizen.changelog]
# Categorize commits by type
file = "CHANGELOG.md"
