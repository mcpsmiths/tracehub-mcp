[tool.commitizen]
name = "cz_conventional_commits"
version = "0.12.2"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
version_scheme = "pep440"

# Files where Commitizen will update the version
version_files = [
    "pyproject.toml:version",
    "src/opentelemetry_mcp/__init__.py:__version__",
    "mcpb/manifest.json:version",
    "mcpb/pyproject.toml:version",
    # both "version" fields (top-level + packages[0]) - published to the MCP Registry on
    # every release; drifted to 0.4.0 once because it was missing from this list
    "server.json:version"
]

# Changelog configuration
[tool.commitizen.changelog]
# Categorize commits by type
file = "CHANGELOG.md"
