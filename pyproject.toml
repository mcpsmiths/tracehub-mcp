[project]
name = "tracehub-mcp"
version = "0.13.0"
description = "MCP server for querying OpenTelemetry traces across multiple observability backends (Jaeger, Tempo, Traceloop, Datadog, and more) for LLM application debugging"
authors = [
    {name = "Doron Kopit", email = "doron@traceloop.com"},
    {name = "Gal Klienman", email = "gal@traceloop.com"},
    {name = "Nir Gazit", email = "nir@traceloop.com"},
    {name = "sairam0424", email = "uggesairam0000@gmail.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = [
    "mcp",
    "opentelemetry",
    "observability",
    "tracing",
    "llm",
    "model-context-protocol",
    "debugging",
    "telemetry",
    "jaeger",
    "tempo",
    "traceloop",
    "datadog",
    "sentry",
    "aws-xray",
    "new-relic",
    "honeycomb"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
dependencies = [
    # Lower bound raised to the version actually locked/tested in uv.lock
    # (2.3.0, which fastmcp 4.1.4's server extra also requires) rather than
    # the original ">=2.0" floor - a fresh resolve outside this repo's
    # `uv sync --frozen` workflow (e.g. `pip install` from an sdist, or a
    # downstream project vendoring this package without the lockfile) could
    # otherwise select an older 2.x point release this project has never
    # actually run against.
    "mcp>=2.3.0,<3",
    # Floor 4.1.3: 4.1.2 closed GHSA-7xgj-8392-5q4r / GHSA-vqqp-x5qm-5qp4, and 4.1.3
    # is the first release whose server extra requires certifi>=2026.10.19
    # (GHSA-6q48-6c7w-9gw2). tests/test_pyproject.py pins this.
    "fastmcp>=4.1.3,<4.2",
    # Pinned directly (not just transitive via mcp/fastmcp/httpx/starlette) to
    # close CVE-2026-63374 (TLS cert-validation bypass via IDNA2003 hostname
    # encoding) and CVE-2026-64847 (process-pool stderr-pipe DoS), both fixed
    # in 4.14.2 - anyio has no entry in this project's own dependencies, so
    # pip-audit flagging it was otherwise invisible to Dependabot (which only
    # tracks direct + lockfile-pinned versions, not "whatever the resolver
    # happens to pick" for a transitive dep with no floor here).
    "anyio>=4.14.2",
    # Same reasoning as anyio above: fastmcp-slim only requires authlib>=1.6.11
    # and nothing here floors dnspython, so a resolve outside uv.lock could still
    # land on a release with a published advisory. certifi is already floored
    # transitively by fastmcp>=4.1.3 but is pinned here too so the floor cannot
    # vanish if a later fastmcp drops it.
    #   authlib>=1.9.0      CVE-2026-96760 (critical) and 7 more advisories
    #   dnspython>=2.9.0    CVE-2026-114605 (high)
    #   certifi>=2026.10.19 GHSA-6q48-6c7w-9gw2 / PYSEC-2026-4320 (critical)
    "authlib>=1.9.0",
    "dnspython>=2.9.0",
    "certifi>=2026.10.19",
    "pydantic>=2.12,<2.15",
    "httpx~=0.28.0",
    "python-dotenv~=1.2.2",
    "click>=8.3,<8.6",
    "uvicorn>=0.40,<0.55",
    "opentelemetry-semantic-conventions-ai>=0.4.13",
    "opentelemetry-semantic-conventions>=0.60b0",
    "tenacity>=9.1,<10",
    # Lower bounds raised to the versions actually locked/tested in
    # uv.lock (1.45.2 / 1.45.2 / 1.43.97) rather than the original,
    # much-wider ">=1.30"/">=1.40" floors - a fresh resolve outside this
    # repo's `uv sync --frozen` workflow could otherwise select an older
    # point release predating a since-patched CVE that this project has
    # never actually run against.
    # 1.45.1 closed CVE-2026-114603 (unbounded tracestate parsing in
    # opentelemetry-api); the sdk and exporter pin api to their own version.
    "opentelemetry-sdk>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "boto3>=1.43.97,<2",
]

[project.urls]
Homepage = "https://github.com/mcpsmiths/tracehub-mcp"
Documentation = "https://github.com/mcpsmiths/tracehub-mcp#readme"
Repository = "https://github.com/mcpsmiths/tracehub-mcp"
Issues = "https://github.com/mcpsmiths/tracehub-mcp/issues"
Changelog = "https://github.com/mcpsmiths/tracehub-mcp/blob/main/CHANGELOG.md"

[project.scripts]
tracehub-mcp = "opentelemetry_mcp.server:main"

[build-system]
# Exact pin: the release artifact's bytes must depend on reviewed content only,
# not on whatever hatchling PyPI serves at publish time. Must equal the pin in
# [tool.uv] build-constraint-dependencies and .github/requirements-build.txt
# (tests/test_build_toolchain.py); Dependabot bumps the hashed file, a human
# moves these two in the same PR.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry_mcp"]

[tool.uv]
# hatchling and its build-time closure, pinned so `uv build` / `uv sync` resolve
# the same backend everywhere. release.yml additionally passes the hash-bound
# .github/requirements-build.txt via --build-constraints --require-hashes.
build-constraint-dependencies = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.2.0",
    "pytest-asyncio>=1.3,<1.5",
    "pytest-cov>=7.0,<7.2",
    "pytest-recording>=0.13,<0.15",
    "mypy>=1.19,<2.5",
    "ruff>=0.15,<0.18",
    "types-click~=7.1.8",
    "types-boto3[xray]>=1.40,<2",
    "pip-audit>=2.10.1,<3",
    "hypothesis>=6.160,<7",
    # tests/test_workflow_policy.py and friends parse .github/workflows/*.yml;
    # PyYAML was previously only transitive (vcrpy) and had no type stubs.
    "pyyaml>=6.0.3,<7",
    "types-pyyaml>=6.0.12,<7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S110"]
"scripts/**/*.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["opentelemetry_mcp"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=opentelemetry_mcp --cov-report=term-missing"
markers = [
    "unit: Fast unit tests with mocks",
    "integration: Integration tests with real backends using VCR recordings",
    "vcr: Tests using VCR cassette recordings",
]
